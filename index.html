<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لَمّة PLAY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10182b;color:white;font-family:Arial;text-align:center}
header{padding:20px;color:#ffd45c;font-size:32px;font-weight:bold}
.panel{background:#202e48;border-radius:18px;padding:16px;margin:12px auto;max-width:600px}
button{border:0;border-radius:12px;padding:13px 20px;margin:6px;font-size:17px;font-weight:bold;background:#ffd45c;color:#18233b;cursor:pointer}
.hidden{display:none}
#board{display:grid;grid-template-columns:repeat(15,1fr);width:min(94vw,540px);aspect-ratio:1;margin:15px auto;background:white;border:4px solid white}
.cell{border:1px solid #ccd2dc;background:#f8fafc;display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(9px,2.5vw,18px)}
.home.red{background:#ef7777}.home.green{background:#65c98d}.home.yellow{background:#f5dc70}.home.blue{background:#78a1ed}
.safe{background:#e5e7eb}
.center{background:conic-gradient(#65c98d 0 25%,#f5dc70 0 50%,#78a1ed 0 75%,#ef7777 0)}
.token{border:2px solid white;border-radius:50%;width:85%;height:85%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;cursor:pointer}
.token.red{background:#c92525}.token.green{background:#087e3d}.token.yellow{background:#b58b00}.token.blue{background:#2156b5}
#dice{font-size:45px;margin:8px}
</style>
</head>
<body>
<header>🎲 لَمّة PLAY</header>
<section id="menu" class="panel">
<h2>اللعبة تجمعنا ❤️</h2>
<input id="playerName" placeholder="اسم اللاعب">
<br>
<button onclick="start(2)">لاعبين</button>
<button onclick="start(4)">أربعة لاعبين</button>
</section>
<section id="game" class="hidden">
<div class="panel">
<div id="status"></div>
<div id="dice">🎲</div>
<button onclick="roll()">ارمِ النرد</button>
<button onclick="back()">رجوع</button>
</div>
<div id="board"></div>
<div class="panel" id="message">ارمِ النرد للبدء</div>
</section>
<script>
const names=["الأحمر","الأخضر","الأصفر","الأزرق"];
const colors=["red","green","yellow","blue"];
const route=[
[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],
[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],
[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],
[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],
[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],
[14,8],[14,7],[14,6],[13,6],[12,6],[11,6],
[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],
[8,1],[8,0],[7,0],[6,0]
];
const starts=[0,13,26,39];
const safe=[0,8,13,21,26,34,39,47];
let count=2,turn=0,positions=[],rollValue=0,waiting=false;
function start(n){
 count=n;turn=0;rollValue=0;waiting=false;
 positions=Array.from({length:n},()=>[-1,-1,-1,-1]);
 document.getElementById("menu").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 draw();
}
function draw(){
 const board=document.getElementById("board");
 board.innerHTML="";
 for(let r=0;r<15;r++)for(let c=0;c<15;c++){
  let el=document.createElement("div");el.className="cell";
  if(r<6&&c<6)el.classList.add("home","red");
  else if(r<6&&c>8)el.classList.add("home","green");
  else if(r>8&&c>8)el.classList.add("home","yellow");
  else if(r>8&&c<6)el.classList.add("home","blue");
  let ri=route.findIndex(p=>p[0]===r&&p[1]===c);
  if(ri>=0){el.className="cell";if(safe.includes(ri))el.classList.add("safe");}
  if(r>=6&&r<=8&&c>=6&&c<=8)el.className="cell center";
  el.dataset.r=r;el.dataset.c=c;
  board.appendChild(el);
 }
 positions.forEach((pieces,p)=>{
  pieces.forEach((pos,i)=>{
   if(pos<0)return;
   let point=route[(starts[p]+pos)%route.length];
   let cell=board.querySelector(`[data-r="${point[0]}"][data-c="${point[1]}"]`);
   if(!cell)return;
   let t=document.createElement("div");
   t.className="token "+colors[p];t.textContent=i+1;
   t.onclick=()=>move(i);
   cell.appendChild(t);
  });
 });
 document.getElementById("status").textContent="دور اللاعب "+names[turn];
}
function roll(){
 if(waiting)return;
 rollValue=Math.floor(Math.random()*6)+1;
 document.getElementById("dice").textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][rollValue-1];
 waiting=true;
 document.getElementById("message").textContent="اختر قطعة من قطع اللاعب "+names[turn];
}
function move(i){
 if(!waiting)return;
 let old=positions[turn][i];
 if(old===-1&&rollValue!==6){
  document.getElementById("message").textContent="تحتاج رقم 6 لإخراج القطعة";
  return;
 }
 let next=old===-1?0:old+rollValue;
 if(next>57){
  document.getElementById("message").textContent="تحتاج رقماً مضبوطاً للنهاية";
  return;
 }
 positions[turn][i]=next;
 if(next<52){
  let landing=(starts[turn]+next)%52;
  if(!safe.includes(landing)){
   positions.forEach((group,p)=>{
    if(p===turn)return;
    group.forEach((v,j)=>{
     if(v>=0&&v<52&&(starts[p]+v)%52===landing){
      group[j]=-1;
     }
    });
   });
  }
 }
 if(positions[turn].every(v=>v===57)){
  document.getElementById("message").textContent="🏆 فاز اللاعب "+names[turn];
  waiting=false;draw();return;
 }
 waiting=false;
 if(rollValue!==6)turn=(turn+1)%count;
 document.getElementById("message").textContent=rollValue===6?"عندك رمية إضافية!":"تم تحريك القطعة";
 draw();
}
document.getElementById("board").addEventListener("click",e=>{
 if(!waiting)return;
 const token=e.target.closest(".token");
 if(token)return;
});
function back(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
}
</script>
</body>
</html>
